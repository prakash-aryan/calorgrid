[project]
name = "digitalheat"
version = "0.1.0"
description = "DigitalHeat 3D Digital Twin, Reference Scheduler and CPU Worker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.6,<3.0",
    "numpy>=1.26,<3.0",
    "pillow>=10.4,<13.0",
    "pytesseract>=0.3.13,<0.4",
    "psutil>=6.0,<8.0",
    "pyproj>=3.6,<4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
    "httpx>=0.27,<1.0",
    "playwright>=1.48,<2.0",
    "ruff>=0.8,<1.0",
]

[project.scripts]
digitalheat = "digitalheat.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/digitalheat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
